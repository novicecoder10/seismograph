# Issues forecasts for new M5+ earthquakes hourly and scores closed windows daily,
# committing the append-only ledger back to the repository. Free on public
# repositories (GitHub Actions).
name: forecast ledger
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: ledger
  cancel-in-progress: false
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ledger:verify
      - run: npm run ledger:issue
      - name: score (once a day)
        run: |
          if [ "$(date -u +%H)" = "03" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then npm run ledger:score; fi
      - run: npm run ledger:verify
      - name: commit
        run: |
          git config user.name "seismograph-ledger"
          git config user.email "ledger@users.noreply.github.com"
          git add ledger
          git diff --cached --quiet || git commit -m "ledger: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
